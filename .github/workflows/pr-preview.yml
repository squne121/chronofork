name: pr-preview

on:
  workflow_run:
    workflows: [ci]
    types: [requested, in_progress, completed]
  pull_request_target:
    types: [opened, synchronize, reopened, closed, edited]

permissions: {}

jobs:
  route:
    if: >-
      github.repository_id == '1439901120' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'pull_request_target' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    outputs:
      pr: ${{ steps.route.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB scripts/preview/run_preview.py route

  reconcile:
    needs: route
    if: needs.route.outputs.pr != ''
    concurrency:
      group: workers-preview-pr-${{ needs.route.outputs.pr }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: read
    uses: ./.github/workflows/pr-preview-reconcile.yml
    with:
      pr: ${{ needs.route.outputs.pr }}

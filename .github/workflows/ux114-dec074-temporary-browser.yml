name: UX114 DEC-074 temporary A0 future Chromium acceptance
on:
  push:
    branches:
      - feat/ux114-observation-first-pr2-20261110-chat

permissions:
  contents: read

jobs:
  known-a0-future:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real completed A0 observation, known future, A1 isolation
        env:
          CHRONOFORK_E2E_INTEGRATED: '1'
        run: timeout --signal=TERM --kill-after=30s 900s npx playwright test tests/e2e/integrated-mode.spec.ts --grep "観測中心UX114" --workers=1 --retries=0 --reporter=line
      - name: Runner memory snapshot (not peak heap)
        if: always()
        run: |
          free -m
          if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events; fi

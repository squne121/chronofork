name: UX114 temporary real-browser acceptance
on:
  push:
    branches:
      - feat/ux114-observation-first-pr2-20261110-chat

permissions:
  contents: read

jobs:
  observation-real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real A0 to A1 observation and comparison in Chromium
        env:
          CHRONOFORK_E2E_INTEGRATED: '1'
        run: timeout --signal=TERM --kill-after=30s 900s npx playwright test tests/e2e/integrated-mode.spec.ts --grep "観測中心UX114" --workers=1 --retries=0 --reporter=line
      - name: Memory snapshot (environment only)
        if: always()
        run: |
          free -m
          if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events; fi

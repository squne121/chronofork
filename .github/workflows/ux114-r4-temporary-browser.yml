name: UX114 R4 real browser slider and title history
on:
  push:
    branches: [feat/ux114-observation-first-pr2-20261110-chat]
permissions:
  contents: read
jobs:
  chromium-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Actual A0 timeline scrub/title history and A1/A2 regression
        env:
          CHRONOFORK_E2E_INTEGRATED: '1'
        run: timeout --signal=TERM --kill-after=30s 1080s npx playwright test tests/e2e/integrated-mode.spec.ts --grep "観測中心UX114|A0観測→A1第1介入→A2第2介入" --workers=1 --retries=0 --reporter=line
      - name: Runner memory status (not peak process RSS)
        if: always()
        run: |
          free -m
          if test -r /sys/fs/cgroup/memory.events; then cat /sys/fs/cgroup/memory.events; fi

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check decision register
        run: |
          python3 -I scripts/check_decision_records.py --self-test
          python3 -I scripts/check_decision_records.py --github
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --timing
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Check PR preview safety fixtures
        run: |
          python3 -IB scripts/preview/test_preview.py
          python3 -IB scripts/preview/test_reconcile.py
          python3 -IB scripts/test_quick_check.py

  unit:
    name: unit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline --timing
      - name: Vitest shard ${{ matrix.shard }}/2
        run: npm test -- --shard=${{ matrix.shard }}/2

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  worker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Build for GitHub Pages
        if: github.event_name == 'pull_request'
        env:
          VITE_BASE_PATH: /chronofork/
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Verify the GitHub Pages build with a real Worker
        if: github.event_name == 'pull_request'
        env:
          PAGES_SMOKE_REQUIRED: '1'
          PAGES_SMOKE_URL: http://127.0.0.1:4173/chronofork/
          PAGES_EXPECTED_SHA: ${{ github.sha }}
          PAGES_LOCAL_PREVIEW: '1'
        run: npx playwright test tests/e2e/pages-deploy.spec.ts
      - name: Package verified PR build
        id: package-preview
        continue-on-error: true
        if: >-
          github.event_name == 'pull_request' && github.event.repository.id == 1439901120 &&
          github.event.pull_request.base.ref == 'main' &&
          (github.event.pull_request.head.repo.id == 1439901120 || github.event.pull_request.head.repo.id == 1465044544) &&
          github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]' &&
          github.triggering_actor != 'dependabot[bot]'
        run: python3 -I scripts/preview/preview.py package
      - name: Upload verified PR build
        id: upload-preview
        if: steps.package-preview.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-upload/
          if-no-files-found: error
          retention-days: 7
      - name: PR preview artifact ready
        if: >-
          steps.package-preview.outcome == 'success' && steps.upload-preview.outcome == 'success' &&
          steps.upload-preview.outputs.artifact-id != '' && steps.upload-preview.outputs.artifact-digest != ''
        run: printf '%s\n' 'PR 試遊用の成果物を保存しました。公開は未実施です。'
      - name: Report unavailable PR preview artifact
        if: >-
          steps.package-preview.outcome == 'failure' ||
          (steps.package-preview.outcome == 'success' &&
           (steps.upload-preview.outcome != 'success' ||
            steps.upload-preview.outputs.artifact-id == '' || steps.upload-preview.outputs.artifact-digest == ''))
        run: printf '%s\n' '::warning::PR 試遊用の成果物を保存できませんでした。プレビューは未提供です。'

  quick-check:
    if: always()
    needs: [static, unit, e2e, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every verification job
        env:
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
          WORKER: ${{ needs.worker.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          printf 'event=%s ref=%s static=%s unit=%s e2e=%s worker=%s\n' "$EVENT" "$REF" "$STATIC" "$UNIT" "$E2E" "$WORKER"
          test "$STATIC" = success
          test "$UNIT" = success
          test "$E2E" = success
          if [ "$EVENT" = pull_request ]; then
            test "$WORKER" = success
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            test "$WORKER" = skipped
          else
            exit 1
          fi

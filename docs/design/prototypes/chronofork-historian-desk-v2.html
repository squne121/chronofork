<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chronofork｜編纂机 UI連動検証 v2</title>
<style>
:root{--ink:#263337;--muted:#6c7979;--paper:#faf9f5;--paper2:#f2f2eb;--line:#d2d8cf;--focus:#3d756e;--warning:#a75646;--shadow:0 16px 38px rgba(16,34,33,.21)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font:14px/1.65 system-ui,'Noto Sans JP','Yu Gothic',sans-serif;color:var(--ink);background:#e1e4df}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid #357b72;outline-offset:2px}button:not(.word){border:1px solid #bbc7c0;border-radius:7px;background:#f7f8f4;padding:5px 9px;color:#315851}button:hover{filter:brightness(.965)}.quiet{color:var(--muted);font-size:11px}.desk{height:100dvh;width:100vw;position:relative;isolation:isolate;overflow:hidden}.base{position:absolute;inset:0;display:grid;grid-template-columns:40% 60%;gap:1px;background:#aeb7b0}.lane{background:var(--paper);overflow:hidden;position:relative}.lane-label{position:absolute;left:16px;top:11px;z-index:2;background:rgba(249,248,244,.93);padding:5px 10px;letter-spacing:.12em;border-radius:6px;font-size:11px;font-weight:800;color:#526861;border:1px solid #d6dfd7}.chronicle{height:100%;overflow-y:auto;padding:52px 20px 30px 19px;scroll-behavior:smooth}.year-block{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:12px 4px;border-top:1px solid #e4e5df}.year-block.active{background:#e7efeb}.year-tag{font-family:Georgia,serif;font-weight:700;color:#648078;margin-top:4px}.event-title{font-size:15px;font-weight:750;color:#3d5655}.event-text{font-size:13px;margin-top:3px;color:#576867}.word{display:inline;border:0;border-bottom:1px solid #59847b;background:transparent;color:#315e56;font-weight:700;padding:0 1px;margin:0 1px;text-decoration:none;line-height:1.4;font-size:inherit;cursor:help}.word:hover{background:#dcebe3;border-color:#275b51}.event-focus{color:var(--warning)}.placeholder-year{color:#a0a9a5;font-size:12px}.filterstrip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:5px 4px 13px}.filterstrip span{font-size:11px;color:#547569;padding:3px 8px;background:#e6efec;border-radius:99px}.mapview{width:100%;height:100%;background:linear-gradient(145deg,#dce5df,#d2dfd4)}.mapview svg{width:100%;height:100%;display:block}.svg-hit{cursor:help}.svg-hit:hover{filter:brightness(1.14)}.map-status{position:absolute;bottom:15px;right:15px;min-width:185px;max-width:43%;z-index:2;border:1px solid #d1d8cd;border-radius:9px;background:rgba(250,249,244,.94);padding:9px 12px;font-size:11px;pointer-events:none}.map-status strong{display:block;font-size:12px;color:#4d6861}.map-status small{color:var(--muted)}.demo-sign{position:absolute;bottom:13px;left:13px;color:#425956;font-size:10px;z-index:2;background:rgba(248,250,246,.7);padding:3px 8px;border-radius:4px}.player{position:absolute;z-index:16;top:12px;right:12px;min-width:218px;max-width:min(92vw,840px);padding:7px 9px;background:rgba(252,251,246,.97);border:1px solid #bfcac1;border-radius:10px;box-shadow:0 5px 20px #2a393825;display:flex;flex-direction:column;gap:6px}.player .firstline{display:flex;gap:7px;align-items:center;justify-content:flex-end}.player .firstline b{min-width:47px;text-align:center}.player button{min-height:29px;padding:2px 7px}.player select{font-size:12px;border:0;background:transparent;color:#526c65}.scrub{display:none;align-items:center;gap:8px}.scrub input{width:100%;accent-color:#4c8177}.scrub .yearbounds{font-size:10px;color:var(--muted)}.player.expanded{width:min(76vw,840px)}.player.expanded .scrub{display:flex}.end-chip{position:absolute;top:57px;right:14px;z-index:15;background:rgba(255,245,235,.96);border:1px solid #cf9f8c;border-radius:10px;box-shadow:0 5px 22px #4f463525;padding:11px 14px;max-width:345px;display:none}.end-chip.on{display:block}.end-chip strong{display:block;color:#92503d}.end-chip p{margin:3px 0 7px;font-size:12px}.float-layer{position:absolute;inset:0;z-index:20;pointer-events:none}.floatwin{position:absolute;width:318px;min-width:260px;min-height:178px;max-height:80vh;background:#fbfaf7;border:1px solid #a2b4ae;border-radius:11px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:auto;resize:both;pointer-events:auto}.floatwin header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:8px 10px;background:#e8eeea;border-bottom:1px solid #cddad2;z-index:1;cursor:move;touch-action:none}.floatwin header .caption{font-weight:700;font-size:12px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.floatwin header button{border:0;background:transparent;padding:1px 5px}.float-body{padding:12px 14px;overflow:auto;font-size:12px}.float-body h3{font-size:16px;margin:0 0 6px}.float-body p{margin:6px 0;color:#4d5c5b}.fact{padding:8px 9px;border-left:3px solid #9daea7;background:#f0f3ef;margin:8px 0}.float-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.float-actions button{font-size:11px}.float-links{margin-top:10px;display:flex;gap:4px;flex-wrap:wrap}.float-links button{font-size:11px}.mini{font-size:10px;color:#81908b}.familyrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:7px 0}.familyrow .member{border:1px solid #b4c0b7;padding:6px;background:#f1f5f1;border-radius:6px;text-align:center;min-width:84px}.familyline{text-align:center;color:#879891}.decision-list{border-left:2px solid #afc5bb;padding-left:9px;margin:10px 0}.decision-list div{margin:5px 0}.preview{position:absolute;z-index:45;max-width:282px;min-width:245px;background:#fffefa;border:1px solid #9dafaa;border-radius:9px;box-shadow:0 9px 30px #263b3640;padding:10px 12px;font-size:12px;pointer-events:auto}.preview h4{margin:0 0 5px;font-size:14px}.preview p{margin:0 0 7px;color:#536561}.preview small{font-size:10px;color:#7c9087}.ctx{position:absolute;z-index:70;width:230px;background:#fffefb;border:1px solid #9aada6;border-radius:9px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:3px}.ctx button{text-align:left;border:0!important;background:transparent!important;padding:7px 9px!important;font-size:12px}.ctx button:hover{background:#e8f0ec!important}.ctx b{font-size:11px;padding:4px 8px;color:#536f67}.toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#314e48;color:white;padding:6px 13px;border-radius:8px;font-size:12px;z-index:90;pointer-events:none;opacity:0;transition:opacity .2s}.toast.show{opacity:1}.compare-table{display:grid;grid-template-columns:1fr 1fr;gap:8px}.branch-card{padding:9px;background:#eff2ed;border-radius:7px;border:1px solid #ccd8cf}.branch-card b{display:block;font-size:12px}.branch-card .big{font-size:16px;font-weight:800;margin:6px 0}.compare-note{font-size:11px;color:#6b7874}.hidden{display:none!important}svg text{font-family:system-ui,'Noto Sans JP',sans-serif}
@media(max-width:780px){.base{grid-template-columns:48% 52%}.chronicle{padding-left:5px;padding-right:5px}.year-block{grid-template-columns:48px minmax(0,1fr);gap:3px}.event-title{font-size:12px}.event-text{font-size:11px}.map-status{max-width:85%}.floatwin{max-width:calc(100vw - 12px)}.player{max-width:calc(100% - 16px)}}
</style></head>
<body><main class="desk" id="desk" aria-label="歴史編纂者の机、操作の試作">
<section class="base">
 <article class="lane" aria-label="年代記"><div class="lane-label">年代記 <span id="chronlabel"></span></div><div class="chronicle" id="chronicle"></div></article>
 <article class="lane" aria-label="世界俯瞰"><div class="lane-label">世界俯瞰 <span id="worldlabel"></span></div><div class="mapview" id="mapview"></div><div class="map-status" id="mapstatus"></div><span class="demo-sign">架空の操作検証データ・実WorldState未接続</span></article>
</section>
<div class="player" id="player"><div class="firstline"><select id="branch" aria-label="世界線"><option value="A0">原史 A0</option><option value="A1">仮の改変史 A1</option></select><button id="prev" title="前の年">‹</button><button id="play" title="再生・停止" aria-label="再生">▶</button><button id="next" title="次の年">›</button><b id="yearhead">1280</b><select id="speed" title="再生速度"><option value="1100">1×</option><option value="450">2×</option><option value="220">4×</option></select><button id="toggleSeek" title="シークバーを開く・畳む">▤</button></div><div class="scrub" id="scrub"><span class="yearbounds">1280</span><input id="seek" type="range" min="1280" max="1287" step="1" value="1280" aria-label="観測年"><span class="yearbounds">1287</span></div></div>
<div class="end-chip" id="endChip"><strong>最後の記録に到達しました</strong><p>年代記の出来事や地図上の対象にマウスを重ねると、そこから調査を始められます。</p><button id="endInvestigate">最後の記録を調べる</button> <button id="dismissEnd">×</button></div>
<div id="floatLayer" class="float-layer" aria-live="polite"></div><div id="preview" class="preview hidden"></div><div id="ctx" class="ctx hidden"></div><div id="toast" class="toast" role="status"></div>
</main>
<script>
/* この試作の「戦争・増税・反乱・王朝断絶」はすべて架空であり実ゲームのイベントではない */
const $=id=>document.getElementById(id); const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const records={
 war:{kind:'出来事',name:'国境戦争',at:1281,desc:'東部国境で戦争が始まった。戦費が財政判断へ影響するという設定の仮記録。',links:['decision-war','tax','ruler']},
 tax:{kind:'出来事',name:'戦費のための増税',at:1283,desc:'戦費の調達を理由に徴税の強化が決定されたという、仮のEvent。',links:['decision-tax','commons','war']},
 protest:{kind:'出来事',name:'納税への抗議',at:1284,desc:'平民集団が新しい徴税負担への不満を表明した。',links:['commons','tax','revolt']},
 revolt:{kind:'出来事',name:'平民集団の反乱',at:1285,desc:'平民集団が指導者を擁立して蜂起した。反乱は後の年にも継続するという仮の世界状態。',links:['commons','leader','decision-revolt','siege']},
 siege:{kind:'出来事',name:'城塞の包囲',at:1286,desc:'反乱軍は城塞の周囲へ進んだという仮の出来事。',links:['revolt','heir','leader']},
 death:{kind:'出来事',name:'最後の王家構成員の死',at:1287,desc:'王家の最後の後継者が亡くなったという説明用の仮の記録。正式Goalの評価結果ではない。',links:['heir','family','siege']},
 peace:{kind:'出来事',name:'講和の成立',at:1283,desc:'仮のA1では国境戦争を避けた結果として講和が成立した想定。実シミュレーションの結果ではない。',links:['decision-war','ruler']},
 renewal:{kind:'出来事',name:'交易の回復',at:1285,desc:'仮のA1で交易が回復した、という比較のための設定。',links:['commons','peace']},
 heir:{kind:'人物',name:'最後の後継者 リアン',desc:'王家の継承者。生存・王朝帰属・称号は本来、各時点の実記録から確かめる必要がある。',links:['family','death','ruler','siege']},
 ruler:{kind:'人物',name:'王 アルデン',desc:'増税政策を承認したと設定された君主。判断理由は別の記録を開いて確認する。',links:['decision-tax','decision-war','family','tax']},
 leader:{kind:'人物',name:'指導者 マレク',desc:'反乱で平民集団の指導者となった人物という仮の設定。',links:['commons','revolt','decision-revolt','heir']},
 commons:{kind:'社会集団',name:'河畔地方の平民集団',desc:'地域人口と税負担、統治への反応を持つ仮の社会集団。集団と個人の関係は資料として調べられる。',links:['leader','revolt','tax','decision-tax']},
 region:{kind:'地域',name:'河畔城塞地方',desc:'城塞、橋、市街地がある地域。特定年のイベントと、続く状態を分けて表示する。',links:['commons','siege','tax','war']},
 family:{kind:'家系図',name:'王家の家系',desc:'選択年と世界線の記録から、人物・親子・婚姻を表示するための資料。',links:['heir','ruler','death']},
 'decision-war':{kind:'判断根拠',name:'国境戦争への判断',at:1281,desc:'「緊張が高まったため」という仮の説明。製品ではDecisionTraceに記載がある条件以外を因果として断定しない。',links:['ruler','war','decision-tax']},
 'decision-tax':{kind:'判断根拠',name:'増税を選んだ理由',at:1283,desc:'「戦費を補うため」という仮の意思決定根拠。実際にはDecisionTraceと政策時点の国家状態で検証する。',links:['ruler','war','tax','commons']},
 'decision-revolt':{kind:'判断根拠',name:'蜂起に至った判断',at:1285,desc:'税負担と政治的不満を関連要因とした例示。時間的な前後のみでは因果の証明にならない。',links:['leader','commons','revolt','decision-tax']},
 'relation':{kind:'人物・集団の関係',name:'平民集団とマレク',desc:'集団の構成員／指導者としての関係を、選択年に応じて表示する検証用資料。',links:['commons','leader','revolt']},
 'comparison':{kind:'世界線比較',name:'同一年の歴史を比較',desc:'原史A0と仮のA1を同じ年で対比する。ゲームの正式な介入結果ではない。',links:['war','tax','revolt','death']}
};
const eventsA0=[{year:1281,id:'war',text:[['東部国境で',null],['国境戦争','war'],['が始まった。',null]]},{year:1283,id:'tax',text:[['王',null],['アルデン','ruler'],['が戦費確保のため',null],['増税','tax'],['を承認した。',null]]},{year:1284,id:'protest',text:[['河畔地方の',null],['平民集団','commons'],['が税負担に抗議した。',null]]},{year:1285,id:'revolt',text:[['平民集団','commons'],['が',null],['マレク','leader'],['を指導者として反乱を起こした。',null]]},{year:1286,id:'siege',text:[['反乱軍','commons'],['が',null],['河畔城塞','region'],['を包囲した。',null]]},{year:1287,id:'death',text:[['最後の王家構成員',null],['リアン','heir'],['の死が記録された。',null]]}];
const eventsA1=[{year:1283,id:'peace',text:[['王',null],['アルデン','ruler'],['は国境で',null],['講和','peace'],['を選んだ。',null]]},{year:1285,id:'renewal',text:[['河畔地方','region'],['で',null],['交易の回復','renewal'],['が報告された。',null]]}];
const state={year:1280,branch:'A0',playing:false,timer:null,seekOpen:false,ended:false,filter:null,win:[],previewId:null,previewFor:null,ctxId:null,z:30,hoverTimer:null,hideTimer:null};
const observed=()=>state.branch==='A0'?eventsA0:eventsA1;
const eventsThrough=()=>observed().filter(e=>e.year<=state.year&&(!state.filter||e.id===state.filter||e.text.some(t=>t[1]===state.filter)||records[e.id]?.links?.includes(state.filter)));
const eventNow=()=>observed().filter(e=>e.year===state.year);
const rhtml=id=>records[id]?`<button class="word" data-ref="${id}" title="マウスを重ねて内容を確認／中クリックで固定／右クリックで操作">${records[id].name}</button>`:id;
function renderChronicle(){const root=$('chronicle');const atBottom=root.scrollTop+root.clientHeight>=root.scrollHeight-45;let out='';
if(state.filter)out+=`<div class="filterstrip"><span>関連記録：${records[state.filter]?.name||state.filter}</span><button data-cmd="clear-filter">解除</button></div>`;
for(let year=1280;year<=state.year;year++){const list=eventsThrough().filter(e=>e.year===year);if(!list.length&&year!==1280&&year!==state.year)continue;out+=`<section class="year-block ${year===state.year?'active':''}"><div class="year-tag">${year}</div><div>`;if(!list.length)out+='<div class="placeholder-year">この年の対象記録なし</div>';
for(const e of list){out+=`<div class="event-title">${rhtml(e.id)}</div><div class="event-text">${e.text.map(t=>t[1]?rhtml(t[1]):t[0]).join('')}</div>`;}out+='</div></section>';}root.innerHTML=out;if(atBottom||state.playing||state.ended)root.scrollTop=root.scrollHeight;
$('chronlabel').textContent=`· ${state.branch}`;}
function svgWorld(){const {year:y,branch:b}=state;const revolt=b==='A0'&&y>=1285;const siege=b==='A0'&&y>=1286;const taxNow=b==='A0'&&y===1283;const warNow=b==='A0'&&y===1281;const revoltNow=b==='A0'&&y===1285;const deathNow=b==='A0'&&y===1287;const peaceNow=b==='A1'&&y===1283;
const unstable=revolt?`<ellipse cx="280" cy="235" rx="148" ry="86" fill="#be6155" opacity=".16"/><path d="M166 215 Q250 175 347 200" fill="none" stroke="#a45b4a" stroke-dasharray="9 7" stroke-width="7" opacity=".6"/>`:'';
const marker=(x,yy,label,id,color)=>`<g class="svg-hit" tabindex="0" data-ref="${id}" role="button" aria-label="${label}"><circle cx="${x}" cy="${yy}" r="19" fill="${color}" stroke="#fffbf2" stroke-width="3"/><text x="${x}" y="${yy+4}" font-size="11" font-weight="750" fill="white" text-anchor="middle">${label}</text></g>`;
const houses=Array.from({length:20},(_,i)=>{const x=95+(i%5)*34,yy=178+Math.floor(i/5)*23;return `<g><path d="M${x} ${yy} l10 -7 l12 7 l-10 7 z" fill="#ccbd9e"/><path d="M${x} ${yy}v12l12 7v-12 M${x+12} ${yy+7}l10 -7v12l-10 7" fill="#aa9b83" stroke="#867e6b" stroke-width=".7"/></g>`}).join('');
return `<svg viewBox="0 0 570 410" preserveAspectRatio="xMidYMid meet" aria-label="${y}年の仮想世界図" role="img"><rect width="570" height="410" fill="#dce8df"/><path d="M0 130L105 92L205 125L307 78L456 103L570 78V410H0Z" fill="#b8c6ae"/><path d="M-20 290 Q112 223 226 323 T590 308" stroke="#80b0bf" stroke-width="48" fill="none"/><path d="M-20 290 Q112 223 226 323 T590 308" stroke="#a6cbd1" stroke-width="33" fill="none"/><path d="M105 157L300 101L433 160L433 218L301 263L105 216Z" fill="#8f9d88"/><path d="M105 157L300 101L433 160L301 213Z" fill="#b9bfa7"/><path d="M105 216 L301 263 L433 218" fill="none" stroke="#89917e" stroke-width="3"/><path d="M280 240 L342 312" stroke="#968770" stroke-width="24"/><path d="M280 240 L342 312" stroke="#c9b89b" stroke-width="15"/>${houses}<g class="svg-hit" data-ref="region" tabindex="0" role="button" aria-label="河畔城塞地方"><path d="M218 168L279 145L343 169L279 199Z" fill="#c0ab8c" stroke="#6b726a" stroke-width="2"/><path d="M218 168v-34l60-23v34m65 24v-34l-65-24" fill="none" stroke="#837866" stroke-width="12"/><path d="M230 127v-22h22v20m63 25v-24h19v35" fill="none" stroke="#978873" stroke-width="7"/><text x="282" y="142" font-size="12" fill="#4f5f57" text-anchor="middle">河畔城塞</text></g>${unstable}${siege?`<g class="svg-hit" data-ref="siege" tabindex="0" role="button" aria-label="継続中の城塞包囲"><ellipse cx="286" cy="161" rx="104" ry="64" fill="none" stroke="#ac6152" stroke-width="5" stroke-dasharray="8 7"/></g>`:''}${taxNow?marker(153,232,'税','tax','#ab8051'):''}${warNow?marker(484,143,'戦','war','#9c705e'):''}${revoltNow?marker(162,250,'反','revolt','#a95747'):''}${deathNow?marker(285,110,'死','death','#975955'):''}${peaceNow?marker(487,142,'和','peace','#4e8674'):''}<text x="24" y="386" font-size="11" fill="#5d7768">${b} · ${y}年</text></svg>`;}
function renderMap(){$('mapview').innerHTML=svgWorld();const {year:y,branch:b}=state;let label=b==='A1'?'和平・交易の回復（仮）':y>=1286?'城塞包囲が継続中（仮の状態）':y>=1285?'反乱が継続中（仮の状態）':y>=1283?'徴税強化の影響が残る（仮の状態）':'通常の統治状態（仮）';$('worldlabel').textContent=`· ${b}`; $('mapstatus').innerHTML=`<strong>${y}年の状態</strong>${label}<br><small>出来事の印は発生年だけ。継続する状態は地形の演出で表現</small>`;}
function renderPlayer(){$('yearhead').textContent=state.year+'年';$('seek').value=state.year;$('branch').value=state.branch;$('play').textContent=state.playing?'Ⅱ':'▶';$('play').setAttribute('aria-label',state.playing?'停止':'再生');$('player').classList.toggle('expanded',state.seekOpen&&!state.playing);$('endChip').classList.toggle('on',state.ended&&!state.playing);}
const renderedAt=w=>w.lockedYear??state.year;const wbranch=w=>w.lockedBranch??state.branch;
function existsAt(id,y,br){if(id==='heir'&&br==='A0'&&y>=1287)return '死亡記録あり';if(id==='leader'&&y<1285)return 'この年は指導者就任前';if(id==='commons')return br==='A0'&&y>=1285?'蜂起中':'活動中';if(records[id]?.at)return y<records[id].at?'発生前':((br==='A1'&&['war','tax','protest','revolt','siege','death','decision-tax','decision-revolt','decision-war'].includes(id))||(br==='A0'&&['peace','renewal'].includes(id))?'この世界線には記録なし':'記録を閲覧中');return '参照可能';}
function entityContent(w){const id=w.id,ref=records[id],y=renderedAt(w),br=wbranch(w); if(!ref)return '';let availability=existsAt(id,y,br);let s=`<div class="mini">${ref.kind}　· 観測 ${y}年 / ${br}　· ${w.lockedYear!==null?'年固定':'年に追従'}</div><h3>${ref.name}</h3>${availability==='この世界線には記録なし'?'<div class="fact">この世界線にはこの出来事・判断記録がありません。別世界線の内容は表示しません。</div>':`<p>${ref.desc}</p><div class="fact"><b>この時点：</b>${availability}</div>`}`;if(availability==='この世界線には記録なし')return s;
if(id==='commons')s+=`<div class="fact">仮の集団状態：${br==='A0'&&y>=1285?'反乱が継続':'反乱は記録されていない'}。人口・支持・徴税の本番値は未接続。</div>`;
if(['heir','ruler','leader','commons','region'].includes(id))s+=`<div class="float-actions">${['heir','ruler','leader'].includes(id)?`<button data-action="family" data-id="${id}">家系図</button>`:''}<button data-action="relation" data-id="${id}">関係を調べる</button><button data-action="filter" data-id="${id}">年表を絞る</button><button data-action="decision" data-id="${id}">判断根拠を調べる</button></div>`;
if(id==='family')s+=`<div class="familyrow"><button class="member" data-ref="ruler">王 アルデン</button></div><div class="familyline">│ 親子関係（仮）</div><div class="familyrow"><button class="member" data-ref="heir">リアン ${br==='A0'&&y>=1287?'†':''}</button></div><p class="mini">選択した年・世界線で家系と生死が変化します。不存在を補完しません。</p>`;
if(id.startsWith('decision'))s+=`<div class="decision-list"><div>① 判断した主体：${rhtml('ruler')}</div><div>② 判断時点の条件：<b>仮の記録</b></div><div>③ 関連した出来事：下の関連資料から追跡</div></div><p class="mini">実EventLog/DecisionTraceとの因果接続は未検証です。</p>`;
if(id==='relation')s+=`<div class="familyrow"><button class="member" data-ref="commons">平民集団</button> → <button class="member" data-ref="leader">マレク</button></div><div class="mini">${y>=1285?'指導者関係あり（仮）':'指導者関係はこの年には未成立'}</div>`;
if(id==='comparison'){const a=y<1285?'反乱発生前':y<1287?'反乱・包囲':'王朝最後の後継者の死（仮）',b=y<1283?'分岐前':'国境和平・安定の仮定';s+=`<div class="compare-table"><div class="branch-card"><b>原史A0</b><div class="big">${a}</div><div class="mini">${y}年</div></div><div class="branch-card"><b>仮のA1</b><div class="big">${b}</div><div class="mini">${y}年</div></div></div><p class="compare-note">共通の観測年を使用。A1の結果は架空の説明用データで、実シミュレーションではない。</p>`;}
s+=`<div class="mini" style="margin-top:10px">関連資料をマウスオーバー・中クリック・右クリック</div><div class="float-links">${(ref.links||[]).filter(k=>records[k]).map(k=>`<button class="word" data-ref="${k}">${records[k].name}</button>`).join('')}</div>`;
return s;}
function windowTitle(w){return records[w.id]?.name||w.id;}
function createWindow(id,anchor,opts={}){if(!records[id])return;let w=state.win.find(w=>w.id===id&&!opts.duplicate);if(w){w.z=++state.z;renderWindows();return;}if(state.win.length>=8){toast('資料が多いため、不要な資料を閉じてください');return;}
const desk=$('desk').getBoundingClientRect();const x=anchor?.clientX??desk.width*.61,y=anchor?.clientY??desk.height*.27;
const fromWin=anchor?.target?.closest?.('.floatwin')?.getBoundingClientRect();const fromChronicle=anchor?.target?.closest?.('.chronicle');
let px,py;
if(fromWin){px=fromWin.right+14+330<=desk.width?fromWin.right+14:(fromWin.left-340>=8?fromWin.left-338:fromWin.left+34);py=fromWin.top+28;}
else if(fromChronicle&&desk.width>=1000){px=desk.width*.4+14;py=y-150;}
else {px=x+20;py=y>desk.height*.5?y-315:y+15;}
const wnew={uid:'w'+Math.random().toString(36).slice(2),id,x:clamp(px,8,desk.width-337),y:clamp(py,10,desk.height-400),z:++state.z,lockedYear:null,lockedBranch:null};state.win.push(wnew);hidePreview(true);state.ended=false;renderWindows();renderPlayer();}
function renderWindows(){const layer=$('floatLayer');const existing=new Map([...layer.children].map(el=>[el.dataset.uid,el]));for(const w of state.win){let el=existing.get(w.uid);if(!el){el=document.createElement('section');el.className='floatwin';el.dataset.uid=w.uid;el.innerHTML='<header><span class="caption"></span><div><button data-win-act="lock" title="観測年と世界線を固定する">◇</button><button data-win-act="close" title="閉じる">×</button></div></header><div class="float-body"></div>';layer.appendChild(el);const head=el.querySelector('header');head.addEventListener('pointerdown',ev=>{if(ev.target.closest('button'))return;ev.preventDefault();el.setPointerCapture(ev.pointerId);let sx=ev.clientX,sy=ev.clientY,bx=w.x,by=w.y;const move=e=>{w.x=clamp(bx+e.clientX-sx,2,$('desk').clientWidth-65);w.y=clamp(by+e.clientY-sy,2,$('desk').clientHeight-55);el.style.left=w.x+'px';el.style.top=w.y+'px';};const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);};el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);});}
el.style.left=w.x+'px';el.style.top=w.y+'px';el.style.zIndex=w.z;el.querySelector('.caption').textContent=windowTitle(w);el.querySelector('.float-body').innerHTML=entityContent(w);el.querySelector('[data-win-act=lock]').textContent=w.lockedYear===null?'◇':'◆';el.querySelector('[data-win-act=lock]').title=w.lockedYear===null?'観測年・世界線を固定':'共通の観測年・世界線へ追従';existing.delete(w.uid);}for(const el of existing.values())el.remove();}
function render(){renderChronicle();renderMap();renderPlayer();renderWindows();}
function setYear(y){state.year=clamp(Number(y),1280,1287);state.ended=false;render();}
function stop(){state.playing=false;clearTimeout(state.timer);state.timer=null;renderPlayer();}
function tick(){if(!state.playing)return;if(state.year>=1287){stop();state.ended=true;state.seekOpen=true;renderPlayer();return;}state.year++;render();state.timer=setTimeout(tick,Number($('speed').value));}
function play(){if(state.playing){stop();return;}if(state.year>=1287){state.year=1280;state.ended=false;}state.playing=true;state.seekOpen=false;render();state.timer=setTimeout(tick,Number($('speed').value));}
function toast(s){const el=$('toast');el.textContent=s;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),1700);}
function hidePreview(force){clearTimeout(state.hoverTimer);if(force){$('preview').classList.add('hidden');state.previewId=null;state.previewFor=null;return;}clearTimeout(state.hideTimer);state.hideTimer=setTimeout(()=>{if(!state.previewFor){$('preview').classList.add('hidden');state.previewId=null;}},220);}
function previewAt(id,ev,anchor){if(!records[id]||state.previewId===id&&state.previewFor===anchor)return;clearTimeout(state.hoverTimer);clearTimeout(state.hideTimer);state.previewId=id;state.previewFor=anchor;const el=$('preview');el.classList.remove('hidden');el.innerHTML=`<h4>${records[id].name}</h4><p>${records[id].desc}</p><small>しばらく保持すると固定 · クリック／中クリックで即固定 · 右クリックで操作</small>`;
const desk=$('desk'),r=desk.getBoundingClientRect();let xx=ev.clientX-r.left+15,yy=ev.clientY-r.top+14;el.style.left=clamp(xx,8,desk.clientWidth-300)+'px';el.style.top=clamp(yy,8,desk.clientHeight-150)+'px';state.hoverTimer=setTimeout(()=>{if(state.previewId===id&&state.previewFor===anchor)createWindow(id,{clientX:xx,clientY:yy},{});},1750);}
function contextAt(id,ev){hidePreview(true);state.ctxId=id;const m=$('ctx');let ops=[['open','資料を固定して開く'],['filter','関連する年代記を絞る'],['relation','人物・集団の関係を見る'],['family','家系図を開く'],['decision','判断根拠を調べる'],['compare','同じ年の世界線を比べる'],...(records[id]?.at?[['jump','記録が発生した年へ移動']]:[])];m.innerHTML=`<b>${records[id]?.name||id}</b>`+ops.map(([k,t])=>`<button data-menu="${k}" data-id="${id}">${t}</button>`).join('');m.classList.remove('hidden');m.style.left=clamp(ev.clientX+6,8,$('desk').clientWidth-239)+'px';m.style.top=clamp(ev.clientY+6,8,$('desk').clientHeight-270)+'px';}
function action(type,id,ev){const a={clientX:ev?.clientX??innerWidth*.65,clientY:ev?.clientY??innerHeight*.34};if(type==='jump'&&records[id]?.at){stop();setYear(records[id].at);toast('記録の年へ移動しました');}else if(type==='filter'){state.filter=id;renderChronicle();toast('年代記を関連記録に絞りました');}else if(type==='family')createWindow('family',ev||a);else if(type==='relation')createWindow(['ruler','heir'].includes(id)?'family':'relation',ev||a);else if(type==='decision')createWindow(id==='tax'||id==='ruler'?'decision-tax':id==='war'?'decision-war':'decision-revolt',ev||a);else if(type==='compare')createWindow('comparison',ev||a);else createWindow(id,ev||a);$('ctx').classList.add('hidden');}
$('play').addEventListener('click',play);$('prev').onclick=()=>{stop();setYear(state.year-1);};$('next').onclick=()=>{stop();setYear(state.year+1);};$('seek').oninput=e=>{const year=Number(e.target.value);stop();setYear(year);};$('branch').onchange=e=>{const branch=e.target.value;stop();state.branch=branch;state.filter=null;state.ended=false;render();};$('toggleSeek').onclick=()=>{stop();state.seekOpen=!state.seekOpen;renderPlayer();};$('endInvestigate').onclick=e=>createWindow('death',{clientX:innerWidth*.48,clientY:90});$('dismissEnd').onclick=()=>{state.ended=false;renderPlayer();};
$('desk').addEventListener('pointerover',e=>{const ref=e.target.closest('[data-ref]');if(!ref||ref===state.previewFor)return;if(state.playing){stop();toast('資料を読むため再生を一時停止しました');}previewAt(ref.dataset.ref,e,ref);});
$('desk').addEventListener('pointerout',e=>{const r=e.target.closest('[data-ref]');if(r&&r===state.previewFor&&!r.contains(e.relatedTarget)){state.previewFor=null;hidePreview(false);}});
$('preview').addEventListener('pointerenter',()=>{clearTimeout(state.hideTimer);});$('preview').addEventListener('pointerleave',()=>{state.previewFor=null;hidePreview(false);});
$('desk').addEventListener('click',e=>{const cmd=e.target.closest('[data-cmd]');if(cmd?.dataset.cmd==='clear-filter'){state.filter=null;renderChronicle();return;}const wa=e.target.closest('[data-win-act]');if(wa){const win=e.target.closest('.floatwin'),w=state.win.find(x=>x.uid===win?.dataset.uid);if(!w)return;if(wa.dataset.winAct==='close')state.win=state.win.filter(x=>x!==w);else if(w.lockedYear===null){w.lockedYear=state.year;w.lockedBranch=state.branch;}else{w.lockedYear=null;w.lockedBranch=null;}renderWindows();return;}const act=e.target.closest('[data-action]');if(act){action(act.dataset.action,act.dataset.id,e);return;}const menu=e.target.closest('[data-menu]');if(menu){action(menu.dataset.menu,menu.dataset.id,e);return;}const ref=e.target.closest('[data-ref]');if(ref){createWindow(ref.dataset.ref,e);return;}if(!e.target.closest('#ctx'))$('ctx').classList.add('hidden');});
$('desk').addEventListener('auxclick',e=>{if(e.button!==1)return;const r=e.target.closest('[data-ref]');if(r){e.preventDefault();createWindow(r.dataset.ref,e);}});
$('desk').addEventListener('contextmenu',e=>{const ref=e.target.closest('[data-ref]');if(!ref)return;e.preventDefault();contextAt(ref.dataset.ref,e);});
$('desk').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [data-ref]')){e.preventDefault();createWindow(e.target.dataset.ref,{clientX:innerWidth*.5,clientY:innerHeight*.3});}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){$('ctx').classList.add('hidden');hidePreview(true);state.ended=false;renderPlayer();}if(e.code==='Space'&&document.activeElement===document.body){e.preventDefault();play();}});
render();
</script></body></html>
